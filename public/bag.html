<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Bag</title>
  <link rel="stylesheet" href="bag.css">
</head>
<body>
  <div class="navbar">
    <div class="logo">
      <a href="dashboard.html"><img src="logo.png" alt="Crave Logo"></a>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="history.html">History</a>
      <a href="profile.html">Profile</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="container">
    <a href="buy.html" class="back-arrow">&#8592;</a>
    <h2>Your Bag</h2>
    <div id="cartContainer" class="listing-grid"></div>

    <div id="totals" class="totals">
      <p id="subtotal">Subtotal: ₹0.00</p>
      <p id="tax">Tax (18%): ₹0.00</p>
      <p id="delivery">Delivery: ₹0</p>
      <p id="grandTotal">Grand Total: ₹0.00</p>
      <button id="checkoutBtn">Checkout</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("token");
      const userId = localStorage.getItem("user_id");

      if (!token || !userId) {
        alert("Please login first");
        window.location.href = "login.html";
        return;
      }

      async function loadCart() {
        try {
          const res = await fetch(`/api/cart/${userId}`, {
            headers: { "Authorization": `Bearer ${token}` }
          });

          const cartItems = await res.json();
          displayCart(cartItems);
        } catch (err) {
          console.error("Failed to load cart:", err);
        }
      }

      function displayCart(cartItems) {
        const container = document.getElementById("cartContainer");
        const subtotalEl = document.getElementById("subtotal");
        const taxEl = document.getElementById("tax");
        const deliveryEl = document.getElementById("delivery");
        const totalEl = document.getElementById("grandTotal");
        const totalsBox = document.getElementById("totals");
        const checkoutBtn = document.getElementById("checkoutBtn");

        container.innerHTML = "";

        if (cartItems.length === 0) {
          container.innerHTML = "<h5><p>Your bag is empty.</p></h5>";
          totalsBox.style.display = "none";
          return;
        }

        let subtotal = 0;
        let disableCheckout = false;

        cartItems.forEach(item => {
          const itemTotal = item.price * item.cart_quantity;
          subtotal += itemTotal;

          const card = document.createElement("div");
          card.className = "listing-card";

          card.innerHTML = `
            <img class="listing-image" src="${item.image_url}" alt="Item Image">
            <h3>${item.title}</h3>
            <p><strong>Price:</strong> ₹${item.price}</p>
            <p><strong>Available:</strong> ${item.available_quantity}</p>
             <p><strong>seller:</strong> ${item.NAME}</p>
            <label><strong>Quantity:</strong>
              <input type="number" min="1" max="${item.available_quantity}" value="${item.cart_quantity}"
              oninput="this.value = Math.min(Math.max(this.value, 1), ${item.available_quantity});"
              onchange="updateQuantity(${item.cart_id}, this.value, ${item.price})">
            </label>
            <p><strong>Total:</strong> ₹<span id="item-total-${item.cart_id}">${itemTotal.toFixed(2)}</span></p>
            <button onclick="removeFromBag(${item.cart_id})" class="remove-btn">Delete</button>
          `;

          container.appendChild(card);

          if (item.cart_quantity > item.available_quantity) {
            disableCheckout = true;
          }
        });

        const tax = subtotal * 0.18;
        const delivery = 13;
        const grandTotal = subtotal + tax + delivery;

        subtotalEl.textContent = `Subtotal: ₹${subtotal.toFixed(2)}`;
        taxEl.textContent = `Tax: ₹${tax.toFixed(2)}`;
        deliveryEl.textContent = `Delivery: ₹${delivery.toFixed(2)}`;
        totalEl.textContent = `Grand Total: ₹${grandTotal.toFixed(2)}`;

        totalsBox.style.display = "block";
        checkoutBtn.disabled = disableCheckout;
        checkoutBtn.style.opacity = disableCheckout ? 0.5 : 1;
        checkoutBtn.title = disableCheckout ? "Fix quantity before checkout" : "";
      }

      window.updateQuantity = async function(cartId, newQty, price) {
        newQty = parseInt(newQty);
        if (newQty < 1) {
          alert("Quantity must be at least 1");
          return;
        }

        try {
          const res = await fetch(`/api/cart/${cartId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ quantity: newQty })
          });

          if (!res.ok) {
            const result = await res.json();
            alert(result.error || "Failed to update quantity.");
            return;
          }

          await loadCart();
        } catch (err) {
          console.error("Error updating quantity:", err);
          alert("Something went wrong.");
        }
      };

      window.removeFromBag = async function(cartId) {
        const confirmDelete = confirm("Are you sure you want to remove this item?");
        if (!confirmDelete) return;

        try {
          const res = await fetch(`/api/cart/${cartId}`, {
            method: 'DELETE',
            headers: { "Authorization": `Bearer ${token}` }
          });

          const result = await res.json();
          if (res.ok) {
            alert("Item removed from bag.");
            loadCart();
          } else {
            alert(result.error || "Error removing item.");
          }
        } catch (err) {
          console.error("Error removing item from bag:", err);
          alert("Something went wrong.");
        }
      };

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "login.html";
      });

      document.getElementById("checkoutBtn").addEventListener("click", () => {
        window.location.href = "payment.html";
      });

      loadCart();
    });
  </script>
</body>
</html>
