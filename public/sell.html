<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sell Item - Crave</title>
  <link rel="stylesheet" href="sell.css" />
</head>
<body>
    
  <div class="sell-container">
    
    <!-- Top Navigation -->
    <div class="nav">
        <div class="nav-logo">
            <a href="dashboard.html"><img src="logo.png" alt="Crave Logo"></a>
          </div>
      <div class="nav-section"></div>
      
      <div class="nav-buttons">
        <button onclick="window.location.href='dashboard.html'">Dashboard</button>
        <button onclick="window.location.href='profile.html'">Profile</button>
        <button onclick="window.location.href='history.html'">History</button>
      </div>
    </div>

    <!-- Form -->
    <div class="form-container">
      <h2>Add Item to Sell</h2>
      <form id="sellForm" enctype="multipart/form-data">
        <input type="text" id="title" placeholder="Item Name" required />
        <textarea id="description" placeholder="Item Description" required></textarea>
        <input type="number" id="price" placeholder="Price (₹)" required />
        <input type="number" id="quantity" placeholder="Quantity" required />
        <input type="date" id="expiry_date" placeholder="Expiry date" required />
        <input type="file" id="image" accept="image/*" required />
        <button type="submit">Add Item</button>
        <p id="message" class="message"></p>
      </form>
    </div>
  </div>

  <script src="sell.js"></script>
</body>
</html>
