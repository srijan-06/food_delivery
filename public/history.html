<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crave | History</title>
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-content">
     <a href="dashboard.html"> <img src="logo.png" alt="Crave Logo" class="logo" /></a>

      <div>
        <button class="button" onclick="location.href='dashboard.html'">Dashboard</button>

        <div class="dropdown">
          <button class="button" onclick="toggleDropdown()">Profile</button>
          <div class="dropdown-menu" id="dropdownMenu">
            <button onclick="location.href='profile.html'">View Profile</button>
            <button id="logoutBtn">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
 <h1 class="page-title">History</h1>
  <!-- Main Content -->
  <div class="container">
    
    <!-- Sold Listings -->
    <div class="section">
      <h2>🛒 Your Listed Items</h2>
      <div id="soldOrders" class="grid"></div>
    </div>

    <!-- Bought Listings -->
    <div class="section">
      <h2>🛒 Your Ordered Items</h2>
      <div id="boughtOrders" class="grid"></div>
    </div>
  </div>
  <div id="reviewModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span id="closeModal" style="float:right; cursor:pointer;">&times;</span>
      <h3>Add Review for <span id="reviewItemTitle"></span></h3>
  
      <div class="star-rating" id="starRating">
        <span class="star" data-value="1">&#9733;</span>
        <span class="star" data-value="2">&#9733;</span>
        <span class="star" data-value="3">&#9733;</span>
        <span class="star" data-value="4">&#9733;</span>
        <span class="star" data-value="5">&#9733;</span>
      </div>
  
      <textarea id="reviewText" rows="4" cols="50" placeholder="Write your review..."></textarea><br>
      <button onclick="submitStarReview()">Submit</button>
      <button onclick="document.getElementById('reviewModal').style.display='none'" style="margin-top:10px;">Cancel</button>

    </div>
  </div>
  
  
  <!-- JavaScript -->
  <script>
function toggleAvailability(listingId, currentStatus) {
  const newStatus = currentStatus === "online" ? "offline" : "online";

  fetch(`/api/listing/${listingId}/status`, {
    method: "PATCH",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${localStorage.getItem("token")}`
    },
    body: JSON.stringify({ avl: newStatus })
  })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert(data.error);
        return;
      }

      // Update the status text
      const statusSpan = document.getElementById(`status-${listingId}`);
      if (statusSpan) {
        statusSpan.textContent = newStatus;
      }

      // Update the button text and onclick
      const btn = document.querySelector(`button[onclick*="toggleAvailability(${listingId}"]`);
      if (btn) {
        btn.textContent = `Make ${newStatus === "online" ? "Offline" : "Online"}`;
        btn.setAttribute("onclick", `toggleAvailability(${listingId}, '${newStatus}')`);
      }
    })
    .catch(err => {
      console.error("Error updating availability:", err);
      alert("Something went wrong.");
    });
}


    function toggleDropdown() {
      const menu = document.getElementById("dropdownMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("token");
      const userId = localStorage.getItem("user_id");

      if (!token || !userId) {
        alert("Please login first");
        window.location.href = "login.html";
        return;
      }

      try {
        const boughtResponse = await fetch(`/api/bought/${userId}`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          }
        });

        const soldResponse = await fetch(`/api/sold/${userId}`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          }
        });

        if (!boughtResponse.ok) {
          const error = await boughtResponse.json();
          console.error("❌ Bought orders error:", error);
          alert("Error fetching bought orders: " + (error.error || "Unknown error"));
          return;
        }

        if (!soldResponse.ok) {
          const error = await soldResponse.json();
          console.error("❌ Sold orders error:", error);
          alert("Error fetching sold orders: " + (error.error || "Unknown error"));
          return;
        }

        const boughtData = await boughtResponse.json();
        const soldData = await soldResponse.json();

        const boughtOrders = document.getElementById("boughtOrders");
        const soldOrders = document.getElementById("soldOrders");

        if (Array.isArray(boughtData)) {
          boughtOrders.innerHTML = boughtData.map(order => `
            <div class="card">
              <img src="${order.image_url}" alt="${order.title}">
              <div class="order-details">
                <h3>${order.title}</h3>
                <p><strong>Seller:</strong> ${order.seller_name}</p>
                <p><strong>Price:</strong> ₹ ${order.price}</p>
                <p><strong>Status:</strong> ${order.status}</p>
                <p><strong>Date:</strong> ${new Date(order.transaction_date).toLocaleString()}</p>
              ${order.status === 'delivered' ? `
  <button onclick="submitReview(${order.seller_id}, '${order.title.replace(/'/g, "\\'")}', '${order.transaction_id}')" class="review-btn">
    Leave a Review
  </button>` : ''}

              </div>
            </div>
          `).join('');
        }

        if (Array.isArray(soldData)) {
  // Group orders by listing_id
  const grouped = soldData.reduce((acc, order) => {
    if (!acc[order.listing_id]) acc[order.listing_id] = [];
    acc[order.listing_id].push(order);
    return acc;
  }, {});

  // Render grouped listings
  soldOrders.innerHTML = Object.entries(grouped).map(([listingId, orders], index) => {
    const first = orders[0]; // Shared data
    const buyerListId = `buyers-${listingId}-${index}`;

    return `
      <div class="card" data-listing-id="${listingId}">
        <img src="${first.image_url}" alt="${first.title}">
        <div class="order-details">
          <h3>${first.title}</h3>
          <p><strong>Quantity Listed:</strong> ${first.quantity_listed}</p>
          <p><strong>Available quantity:</strong> ${first.quantity}</p>

          <button onclick="toggleBuyers('${buyerListId}')" class="buyers-btn">Buyers List</button>
          <div class="buyers-list" id="${buyerListId}" style="display: none; margin-top: 10px;">
            ${
              orders.some(o => o.buyer_name) ?
              orders.map(order => `
                <div class="buyer-entry">
                  <p><strong>Buyer:</strong> ${order.buyer_name}</p>
                  <p><strong>Price:</strong> ₹${order.price}</p>
                  <p><strong>Status:</strong> ${order.status}</p>
                  <p><strong>Date:</strong> ${order.transaction_date ? new Date(order.transaction_date).toLocaleString() : "Not Sold Yet"}</p>
                  <p><strong>Quantity Sold:</strong> ${order.quantity_sold}</p>
                  <hr>
                </div>
              `).join('')
              : `<p>Not Sold Yet</p>`
            }
          </div>
          <p><strong>Availablity:</strong> <span id="status-${listingId}">${first.avl}</span></p>
<button onclick="toggleAvailability(${listingId}, '${first.avl}')" class="toggle-btn">
  Make ${first.avl === "online" ? "Offline" : "Online"}
</button>

         
        </div>
      </div>
    `;
  }).join('');
}

      } 
      catch (error) {
        console.error("🔥 Error fetching order history:", error);
        alert("Something went wrong! Check console for details.");
      }
    });

    async function deleteListing(listingId) {
      if (!confirm("Are you sure you want to delete this listing?")) return;

      const token = localStorage.getItem("token");
      try {
        const response = await fetch(`/api/listing/${listingId}`, {
          method: "DELETE",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          }
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || "Failed to delete listing");
        }

        const data = await response.json();
        alert(data.message);

        const listingCard = document.querySelector(`.card[data-listing-id="${listingId}"]`);
        if (listingCard) listingCard.remove();
      } catch (error) {
        console.error("❌ Error deleting listing:", error);
        alert("Error deleting listing: " + error.message);
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "login.html";
    });
    function toggleBuyers(id) {
  const el = document.getElementById(id);
  if (el.style.display === "none") {
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}
let currentTransactionId = null;

function showReviewForm(transactionId, title) {
  currentTransactionId = transactionId;
  document.getElementById("reviewItemTitle").innerText = title;
  document.getElementById("reviewModal").style.display = "block";
}

document.getElementById("closeModal").addEventListener("click", () => {
  document.getElementById("reviewModal").style.display = "none";
});

let selectedRating = 0;

// Setup star interaction
const stars = document.querySelectorAll('.star');
stars.forEach(star => {
  star.addEventListener('mouseover', () => {
    const val = parseInt(star.dataset.value);
    highlightStars(val);
  });
  star.addEventListener('mouseout', () => {
    highlightStars(selectedRating);
  });
  star.addEventListener('click', () => {
    selectedRating = parseInt(star.dataset.value);
    highlightStars(selectedRating);
  });
});

function highlightStars(value) {
  stars.forEach(star => {
    star.classList.remove('selected');
    if (parseInt(star.dataset.value) <= value) {
      star.classList.add('selected');
    }
  });
}

function submitStarReview() {
  const sellerId = window.currentReviewSellerId;
  const transactionId = window.currentReviewTransactionId;
  const userId = localStorage.getItem("user_id");
  const comment = document.getElementById("reviewText").value.trim();

  if (!selectedRating) {
    alert("Please select a rating by clicking the stars.");
    return;
  }
  if (!comment) {
    alert("Please write a comment.");
    return;
  }

  fetch("/api/reviews", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${localStorage.getItem("token")}`
    },
    body: JSON.stringify({
      reviewer_id: userId,
      seller_id: sellerId,
      rating: selectedRating,
      comment: comment
    })
  })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert("Error adding review: " + data.error);
        return;
      }
      alert("✅ Review submitted!");
      document.getElementById("reviewModal").style.display = "none";
    })
    .catch(err => {
      console.error("❌ Error submitting review:", err);
      alert("Something went wrong.");
    });
}

function submitReview(sellerId, title, transactionId) {
  window.currentReviewSellerId = sellerId;
  window.currentReviewTransactionId = transactionId;
  document.getElementById("reviewItemTitle").innerText = title;
  document.getElementById("reviewModal").style.display = "block";
  selectedRating = 0;
  highlightStars(0);
  document.getElementById("reviewText").value = "";
}

  </script>
</body>
</html>
